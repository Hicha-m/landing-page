name: Validate and deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate collection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate static pages and manifest
        run: python3 scripts/validate_site.py
      - name: Validate JavaScript syntax
        run: |
          set -eu
          find . -type f -name '*.js' -not -path './public/*' -not -path './node_modules/*' -exec node --check {} \;
      - name: Build publication directory
        run: python3 scripts/build_site.py
      - name: Verify output structure
        run: |
          test -s public/index.html
          test -s public/data/projects.json
          test -s public/pages/studiospace/index.html
          test ! -e public/.github

  deploy:
    name: Cloudflare Pages production
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate
        run: python3 scripts/validate_site.py
      - name: Build static files
        run: python3 scripts/build_site.py
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=studiospace-landing --branch=main
